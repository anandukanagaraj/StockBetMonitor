{% extends "base.html" %}
{% block content %}
<section class="manage-hero fund-hero"><div><p class="eyebrow">Investor Management</p><h1>Edit Investor</h1><p>Update identity and contact details. Fund assignments are managed separately inside each fund.</p></div><div class="hero-actions"><a class="button" href="{{ url_for('fund_management.manage_investors') }}">Cancel</a></div></section>
<section class="form-shell"><form class="position-form" method="post" action="{{ url_for('fund_management.edit_investor', investor_id=investor.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required value="{{ investor.name }}"></label><label>Email<input name="email" type="email" value="{{ investor.email or '' }}"></label><label>Phone<input name="phone" value="{{ investor.phone or '' }}"></label><label class="check-row"><input name="is_test_data" type="checkbox" {{ 'checked' if investor.is_test_data else '' }}><span>Test investor</span></label><label class="full">Notes<textarea name="notes" rows="3">{{ investor.notes or '' }}</textarea></label><div class="form-actions full"><a class="button" href="{{ url_for('fund_management.manage_investors') }}">Cancel</a><button class="button primary" type="submit">Save Investor</button></div></form></section>
{% endblock %}
